<style id="css">
:root{
  --paper:#EEE8F1; --card:#FAF7FB; --ink:#2B1D2E; --ink-soft:#6E5F72;
  --lacquer:#A3123A; --lacquer-deep:#6F0B27; --line:#DCD0DF; --bare:#B9A9BD;
  --serif:"Playfair Display",Georgia,serif; --hand:"League Spartan",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hand);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;max-width:100%;overflow-x:hidden;overflow-x:clip}
body{touch-action:manipulation}
html.lock,html.lock body{overflow:hidden}
@media (min-width:960px){html.lock,html.lock body{overflow:visible}}
#root{width:100%;min-width:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--lacquer);outline-offset:2px;border-radius:6px}

/* ---------- unha (o elemento-assinatura) ---------- */
.nail{display:inline-block;flex:none;width:var(--w,10px);height:calc(var(--w,10px) * 1.38);
  border-radius:50% 50% 44% 44% / 64% 64% 36% 36%;border:1.6px solid var(--bare);background:transparent;position:relative}
.nail.on{border-color:#1F4FA8;background:linear-gradient(160deg,#8DBBF3 0%,#3A78D8 45%,#1F4FA8 100%)}
.nail.mark{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--lacquer)}
.nail.on::after{content:"";position:absolute;left:22%;top:14%;width:18%;height:42%;border-radius:40%;background:rgba(255,255,255,.55)}

/* ---------- topo ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));min-width:0}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 4px;min-width:0}
header.top h1{min-width:0;max-width:100%}
.month{font-family:var(--hand);font-weight:700;font-size:clamp(30px,11.5vw,112px);line-height:.9;letter-spacing:-.035em;margin:0;white-space:nowrap}
.mname{display:inline-block;white-space:nowrap}
.year{font-family:var(--hand);font-weight:500;font-size:clamp(16px,4.4vw,30px);letter-spacing:0;color:var(--ink-soft);display:block;white-space:nowrap;margin:.35em 0 0 .08em;line-height:1}
.summary{min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin:14px 4px 16px;color:var(--ink-soft);font-size:15px}
.summary b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;align-items:center;font-size:13px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.status{flex:none;font-size:13px;color:var(--ink-soft);padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;margin-bottom:6px;white-space:nowrap}
.notice{margin:0 4px 14px;padding:12px 14px;border-radius:14px;background:#fff;border:1.5px dashed var(--lacquer);font-size:15px}
.srow:disabled{cursor:default;color:inherit}
.linkbtn{background:none;border:0;padding:4px 0;text-decoration:underline;text-underline-offset:3px;color:var(--ink);font-size:14px}

/* ---------- calendário ---------- */
.layout{display:block}
.cal{background:var(--card);border-radius:20px;padding:6px;border:1px solid var(--line);min-width:0}
.dow,.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.dow div{text-align:center;font-size:13px;color:var(--ink-soft);padding:6px 0 4px}
.week+.week{margin-top:4px}
.day{position:relative;min-width:0;min-height:80px;border-radius:14px;border:1px solid transparent;background:var(--paper);padding:6px 4px 6px;text-align:left;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.day.blank{background:transparent;pointer-events:none}
.day.past{opacity:.5}
.day.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:#fff}
.day .n{font-family:var(--serif);font-size:19px;line-height:1}
.day .today{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--lacquer)}
.minis{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.minis .nail{--w:9px}
.day .full{font-size:11px;color:var(--lacquer);font-weight:600;margin-top:auto}
.day.closed{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(163,18,58,.07) 6px 7px),var(--paper)}
.day .label{font-size:10px;line-height:1.15;color:var(--lacquer);font-weight:600;transform:rotate(-4deg);transform-origin:left;margin-top:4px;letter-spacing:-.01em}
.rows{display:none}

/* ---------- painel do dia ---------- */
.layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.layer.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(43,29,46,.38);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;overflow-x:hidden;visibility:hidden;pointer-events:auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px max(16px,env(safe-area-inset-right)) max(28px,calc(env(safe-area-inset-bottom) + 16px)) max(16px,env(safe-area-inset-left));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:5;overscroll-behavior:contain}
.panel.open{transform:none;visibility:visible}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:2px auto 12px;position:relative}
.grab::before{content:"";position:absolute;left:-40px;right:-40px;top:-14px;bottom:-12px}
.panel{touch-action:pan-y}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-width:0}
.ph h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.02;margin:0}
.ph .wd{display:block;font-family:var(--hand);font-size:15px;color:var(--ink-soft);margin-bottom:4px}
.close{border:1.5px solid var(--ink);background:none;border-radius:999px;padding:6px 14px;font-size:14px}
.daynote{margin:10px 0 0;color:var(--ink-soft);font-size:14px}

.slots{list-style:none;margin:16px 0 0;padding:0}
.slot{border-top:1px dashed var(--line)}
.slot:last-child{border-bottom:1px dashed var(--line)}
.srow{width:100%;display:grid;grid-template-columns:30px auto minmax(0,1fr);align-items:center;gap:10px;background:none;border:0;padding:12px 2px;text-align:left}
.srow .nail{--w:24px}
.srow .t{font-family:var(--serif);font-size:24px;line-height:1;min-width:58px}
.sline{display:flex;align-items:center;gap:8px}
.sline .srow{flex:1 1 auto;min-width:0}
.rm{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.rm:active{border-color:var(--ink);color:var(--ink)}
.rm.armed{border-color:var(--lacquer);background:var(--lacquer);color:#fff}
.srow .who .free{display:block}
.srow .who{min-width:0}
.srow .who strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .who small{display:block;color:var(--ink-soft);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .free{color:var(--ink-soft)}
.slot.isbooked .srow .t{color:var(--lacquer-deep)}

form.edit{background:var(--paper);border-radius:16px;padding:14px;margin:0 0 12px;display:grid;gap:10px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label.fl{display:grid;gap:4px;min-width:0;font-size:13px;color:var(--ink-soft)}
.fl input,.fl textarea{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:42px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-size:16px;color:var(--ink)}
.fl textarea{min-height:58px;resize:vertical}
.fl input:focus,.fl textarea:focus{border-color:var(--ink);outline:none}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--lacquer)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.b{border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;border:1.5px solid var(--ink);background:transparent}
.b.primary{background:var(--lacquer);border-color:var(--lacquer);color:#fff}
.b.ghost{border-color:transparent;text-decoration:underline;text-underline-offset:3px;font-weight:500;padding-inline:6px}
.b.danger{border-color:var(--lacquer);color:var(--lacquer)}

.tools{margin-top:18px;display:grid;gap:14px}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.addrow label{flex:1 1 150px}
.closebox{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.muted{color:var(--ink-soft);font-size:14px;margin:0}

/* ---------- toast e modal ---------- */
.toastlayer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:20}
.toast{visibility:hidden;pointer-events:auto;position:absolute;left:50%;bottom:16px;transform:translate(-50%,140%);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 10px 10px 18px;display:flex;gap:12px;align-items:center;font-size:14px;z-index:20;transition:transform .25s;max-width:calc(100vw - 24px)}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast button{background:var(--paper);color:var(--ink);border:0;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(43,29,46,.45);z-index:30;padding:16px}
.modal.open{display:grid}
.modal .box{background:var(--card);border-radius:20px;padding:18px;font-size:15px;width:min(560px,100%);max-height:100%;overflow:auto;display:grid;gap:12px}
.mtext{white-space:pre-line}
.modal h3{font-family:var(--serif);font-weight:400;font-size:26px;margin:0}
.modal textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace;background:#fff}

/* ---------- computador ---------- */
@media (min-width:960px){
  .wrap{padding:34px 28px 60px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
  .cal{padding:12px}
  .dow,.week{gap:6px}
  .week+.week{margin-top:6px}
  .day{min-height:150px;padding:9px 9px 8px;cursor:pointer;transition:background .15s}
  .day:hover{background:#fff}
  .day .n{font-size:24px}
  .minis{display:none}
  .rows{display:grid;gap:2px;font-size:12.5px;line-height:1.25}
  .rows div{display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;padding:1px 0 1px 3px}
  .rows .nail{--w:8px}
  .rows .tt{font-variant-numeric:tabular-nums;color:var(--ink-soft)}

 true}, {"t": "18:00", "booked": true}]}, "2026-12-21": {"closed": false, "label": "", "slots": [{"t": "08:00", "booked": true}, {"t": "10:30", "booked": true}, {"t": "13:00", "booked": true}, {"t": "15:30", "booked": true}, {"t": "18:00", "booked": true}]}, "2026-12-22": {"closed": false, "label": "", "slots": [{"t": "08:00", "booked": true, "mark": true}, {"t": "10:30", "booked": true, "mark": true}, {"t": "13:00", "booked": true}, {"t": "15:30"}, {"t": "19:30", "booked": true}]}, "2026-12-23": {"closed": false, "label": "", "slots": [{"t": "08:00", "booked": true}, {"t": "10:30", "booked": true}, {"t": "13:00", "booked": true}, {"t": "15:30", "booked": true}, {"t": "18:00", "booked": true}]}, "2026-12-24": {"closed": true, "label": "", "slots": []}, "2026-12-25": {"closed": true, "label": "Natal", "slots": []}, "2026-12-26": {"closed": true, "label": "Fechado", "slots": []}, "2026-12-28": {"closed": false, "label": "", "slots": [{"t": "08:00", "booked": true}, {"t": "10:30"}, {"t": "13:00"}, {"t": "15:30"}, {"t": "18:00"}]}, "2026-12-31": {"closed": true, "label": "Véspera de Ano Novo", "slots": []}}}</script>
<script id="app-js">
(function(){
"use strict";
var Y=2026,M=11; /* dezembro de 2026 */
var DEFAULT_TIMES=["08:00","10:30","13:00","15:30","18:00"];
var WD=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
var WD_SHORT=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
var SERVICES=["Mão","Pé","Pé e mão","Esmaltação em gel","Alongamento","Manutenção","Spa dos pés"];
var KEY="agenda-dez-2026";
var HEAD="<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#EEE8F1\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Agenda\">\n<title>Agenda de dezembro</title>\n<link rel=\"manifest\" href=\"manifest.json\">\n<link rel=\"apple-touch-icon\" href=\"icon-192.png\">\n<link rel=\"icon\" href=\"icon-192.png\">";

var days={};             /* "2026-12-03" -> {closed,label,slots} */
var loaded=false, readOnly=false, status="", updated=0;
var armed=null, selected=null, editing=null, undo=null, toastTimer=null, pendingRender=false;
var today=new Date();today.setHours(0,0,0,0);
var root=document.getElementById("root");

/* ---------- utilidades ---------- */
function pad(n){return(n<10?"0":"")+n}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function dateOf(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(t){var p=t.split(":");return p[0]+"h"+(p[1]==="00"?"":p[1])}
function clone(o){return JSON.parse(JSON.stringify(o))}
function str(v,max){return typeof v==="string"?v.slice(0,max||200):""}
function clean(d){ /* dados compartilhados: validar antes de usar */
  d=d||{};var out={closed:!!d.closed,label:str(d.label,60),slots:[]};
  (Array.isArray(d.slots)?d.slots:[]).forEach(function(s){
    if(!s||!/^\d\d:\d\d$/.test(s.t))return;
    var n={t:s.t};if(s.booked){n.booked=true;["name","service","phone","note"].forEach(function(k){var v=str(s[k],k==="note"?500:120);if(v)n[k]=v});if(s.mark===true)n.mark=true}
    out.slots.push(n);
  });
  out.slots.sort(function(a,b){return a.t<b.t?-1:a.t>b.t?1:0});
  if(typeof d.u==="number"&&isFinite(d.u))out.u=d.u;
  return out;
}
function getDay(k){return days[k]||{closed:false,label:"",slots:DEFAULT_TIMES.map(function(t){return{t:t}})}}
function editDay(k){days[k]=clone(getDay(k));return days[k]}

/* ---------- salvar no aparelho ---------- */
var storageOk=true;
function persist(){
  updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify({updated:updated,days:days}));storageOk=true;setStatus("Salvo neste aparelho")}
  catch(e){storageOk=false;setStatus("Não salvou");toast("Este navegador não guardou a alteração. Use Outro aparelho › Salvar arquivo.")}
}
function setStatus(s){status=s;var el=document.querySelector(".status");if(el)el.textContent=s}
function start(){
  var seed={updated:0,days:{}};
  try{seed=JSON.parse(document.getElementById("seed").textContent)}catch(e){}
  load(seed);
  try{var loc=JSON.parse(localStorage.getItem(KEY)||"null");if(loc&&loc.days)mergeIn(loc.days,true)}catch(e){storageOk=false}
  try{localStorage.setItem(KEY+"-teste","1");localStorage.removeItem(KEY+"-teste")}catch(e){storageOk=false}
  status=storageOk?"Salvo neste aparelho":"Não está salvando";
  loaded=true;render();
  if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}}
}
/* junta dois conjuntos de dias: em cada dia fica a versão alterada por último */
function mergeIn(other,preferOther){
  var n=0;
  Object.keys(other||{}).forEach(function(k){
    if(!/^2026-12-\d\d$/.test(k))return;
    var o=clean(other[k]),mine=days[k],ou=o.u||0,mu=mine&&mine.u||0;
    if(!mine||ou>mu||(preferOther&&ou===mu)){
      if(!mine||JSON.stringify(mine)!==JSON.stringify(o))n++;
      days[k]=o;
    }
  });
  return n;
}
function parseBackup(text){
  text=String(text||"").trim();if(!text)return null;
  var m=text.match(/<script type="application\/json" id="seed">([\s\S]*?)<\/script>/);
  try{var o=JSON.parse(m?m[1]:text);return o&&o.days&&typeof o.days==="object"?o:null}catch(e){return null}
}
function importBackup(text){
  var o=parseBackup(text);
  if(!o){toast("Esse arquivo não é um backup da agenda.");return false}
  var n=mergeIn(o.days,false);persist();closeModal();selected=null;editing=null;render();
  toast(n?(n===1?"1 dia atualizado":n+" dias atualizados")+" com o outro aparelho":"Nada novo: este aparelho já estava em dia");
  return true;
}
function stamp(){var d=new Date();return pad(d.getDate())+"-"+pad(d.getMonth()+1)+"-"+pad(d.getHours())+"h"+pad(d.getMinutes())}
function load(src){
  days={};updated=src.updated||0;
  Object.keys(src.days||{}).forEach(function(k){if(/^2026-12-\d\d$/.test(k))days[k]=clean(src.days[k])});
}
function buildDoc(){
  var css=document.getElementById("css").textContent,js=document.getElementById("app-js").textContent,fe=document.getElementById("fonts"),fonts=fe?fe.textContent:"";
  var json=JSON.stringify({updated:updated,days:days}).replace(/</g,"\\u003c"),S="<"+"/script>";
  return '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n'+HEAD+'\n<style id="fonts">'+fonts+'</style>\n<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="seed">'+json+S+'\n<script id="app-js">'+js+S+'\n</body>\n</html>\n';
}
function download(name,text,type){
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);return true}catch(e){return false}
}

/* ---------- render ---------- */
function stats(){
  var free=0,booked=0;
  for(var d=new Date(Y,M,1);d.getMonth()===M;d.setDate(d.getDate()+1)){
    if(d.getDay()===0)continue;var day=getDay(keyOf(d));if(day.closed)continue;
    day.slots.forEach(function(s){s.booked?booked++:free++});
  }
  return{free:free,booked:booked};
}
function nail(s){return '<i class="nail'+(s.booked?" on":"")+(s.booked&&s.mark?" mark":"")+'" aria-hidden="true"></i>'}

function renderCal(){
  var weeks=[],row=null;
  for(var d=new Date(Y,M,1);d.getMonth()===M;d.setDate(d.getDate()+1)){
    var dow=d.getDay();if(dow===0)continue;var c=dow-1;
    if(!row||c===0){if(row)weeks.push(row);row=[null,null,null,null,null,null]}
    row[c]=new Date(d);
  }
  if(row)weeks.push(row);
  var h='<div class="dow">'+["Seg","Ter","Qua","Qui","Sex","Sáb"].map(function(w){return"<div>"+w+"</div>"}).join("")+"</div>";
  weeks.forEach(function(w){
    h+='<div class="week">';
    w.forEach(function(d){
      if(!d){h+='<div class="day blank"></div>';return}
      var k=keyOf(d),day=getDay(k),cls="day";
      if(d<today)cls+=" past";if(k===selected)cls+=" sel";if(day.closed)cls+=" closed";
      var free=day.slots.filter(function(s){return!s.booked}).length;
      h+='<button class="'+cls+'" data-day="'+k+'" aria-label="'+esc(d.getDate()+" de dezembro"+(day.closed?", fechado":", "+free+" livres de "+day.slots.length))+'"><span class="n">'+d.getDate()+'</span>';
      if(+d===+today)h+='<span class="today" title="Hoje"></span>';
      if(day.closed)h+='<span class="label">'+esc(day.label||"Fechado")+'</span>';
      else{
        h+='<span class="minis">'+day.slots.map(nail).join("")+'</span>';
        h+='<span class="rows">'+day.slots.map(function(s){return'<div class="'+(s.booked?"on-row":"")+'">'+nail(s)+'<span class="tt">'+s.t+'</span><span class="nm">'+(s.booked?esc(s.name||""):"")+'</span></div>'}).join("")+'</span>';
        if(day.slots.length&&!free)h+='<span class="full">lotado</span>';
      }
      h+="</button>";
    });
    h+="</div>";
  });
  return h;
}

function renderPanel(){
  if(!selected)return'<p class="muted">Toque em um dia para ver e marcar horários.</p>';
  var d=dateOf(selected),day=getDay(selected),ro=readOnly;
  var h='<div class="grab"></div><div class="ph"><h2><span class="wd">'+WD[d.getDay()]+'</span>'+d.getDate()+' de dezembro</h2><button class="close" data-act="close">Fechar</button></div>';
  if(day.closed){
    h+='<p class="daynote">Dia fechado'+(day.label?": "+esc(day.label):"")+'.</p>';
    if(!ro)h+='<div class="tools"><div class="btns"><button class="b primary" data-act="reopen">Reabrir o dia</button></div></div>';
    return h;
  }
  var free=day.slots.filter(function(s){return!s.booked}).length;
  h+='<p class="daynote">'+(day.slots.length?(free?free+(free>1?" horários livres":" horário livre")+" de "+day.slots.length:"Todos os horários estão marcados."):"Nenhum horário neste dia."+(ro?"":" Adicione um abaixo."))+'</p>';
  h+='<ul class="slots">';
  day.slots.forEach(function(s,i){
    h+='<li class="slot'+(s.booked?" isbooked":"")+'"><div class="sline"><button class="srow" data-slot="'+i+'" aria-expanded="'+(editing===i)+'"'+(ro?' disabled':'')+'>'+nail(s)+'<span class="t">'+fmt(s.t)+'</span><span class="who">';
    if(s.booked)h+='<strong>'+esc(s.name||"Marcado")+'</strong><small>'+esc([s.service,s.phone].filter(Boolean).join(", ")||(ro?"":"Toque para adicionar detalhes"))+'</small>'+(ro&&s.note?'<small>'+esc(s.note)+'</small>':'');
    else h+='<span class="free">Livre</span>'+(ro?'':'<small>Toque para marcar</small>');
    h+='</span></button>';
    if(!ro)h+='<button class="rm'+(armed===i?" armed":"")+'" data-rm="'+i+'" aria-label="'+(armed===i?"Confirmar remoção do horário de ":"Remover horário de ")+fmt(s.t)+'">'+(armed===i?"Confirmar":"Remover")+'</button>';
    h+='</div>';
    if(editing===i&&!ro)h+=renderForm(s,i);
    h+='</li>';
  });
  h+='</ul><div class="tools">';
  if(!ro)h+='<form class="addrow" data-form="add"><label class="fl">Novo horário<input type="time" name="t" required step="300"></label><button class="b" type="submit">Adicionar horário</button></form>';
  h+='<div class="btns"><button class="b" data-act="copyweek">Copiar livres da semana</button></div>';
  if(!ro)h+='<div class="closebox"><form class="addrow" data-form="closeday"><label class="fl">Fechar este dia (motivo opcional)<input name="label" placeholder="Ex.: feriado, folga" maxlength="60"></label><button class="b danger" type="submit">Fechar o dia</button></form></div>';
  return h+'</div>';
}
function renderForm(s,i){
  var h='<form class="edit" data-form="slot" data-i="'+i+'">';
  h+='<div class="f2"><label class="fl">Cliente<input name="name" value="'+esc(s.name)+'" placeholder="Nome" autocomplete="off" maxlength="120"></label><label class="fl">Horário<input type="time" name="t" value="'+esc(s.t)+'" required step="300"></label></div>';
  h+='<div class="f2"><label class="fl">Serviço<input name="service" list="servicos" value="'+esc(s.service)+'" placeholder="Ex.: pé e mão" maxlength="120"></label><label class="fl">Telefone<input name="phone" type="tel" inputmode="tel" value="'+esc(s.phone)+'" placeholder="(21) 9…" maxlength="40"></label></div>';
  h+='<label class="fl">Observação<textarea name="note" placeholder="Cor, sinal pago, etc." maxlength="500">'+esc(s.note)+'</textarea></label>';
  h+='<label class="check"><input type="checkbox" name="mark"'+(s.mark?" checked":"")+'> Destacar (contorno vermelho)</label>';
  h+='<div class="btns"><button class="b primary" type="submit">'+(s.booked?"Salvar":"Marcar horário")+'</button>';
  if(s.booked)h+='<button class="b danger" type="button" data-act="free">Liberar horário</button>';
  h+='<button class="b ghost" type="button" data-act="remove">Remover horário</button><button class="b ghost" type="button" data-act="cancel">Cancelar</button></div></form>';
  return h;
}

function render(keep){
  pendingRender=false;
  var p0=document.querySelector(".panel"),sc=p0?p0.scrollTop:0;
  var h='<div class="wrap"><header class="top"><h1 class="month"><span class="mname">Dezembro</span><span class="year">2026</span></h1><span class="status" role="status">'+esc(status)+'</span></header>';
  if(!loaded){root.innerHTML=h+'</div>';return}
  var st=stats();
  h+='<div class="summary"><span><b>'+st.free+'</b> livres e <b>'+st.booked+'</b> marcados</span><span class="legend"><span><i class="nail on" style="--w:10px"></i>marcado</span><span><i class="nail" style="--w:10px"></i>livre</span><button class="linkbtn" data-act="backup">Outro aparelho</button></span></div>';
  if(!storageOk)h+='<p class="notice">Este navegador não está guardando as marcações. Depois de marcar, toque em Outro aparelho › Salvar arquivo para não perder nada.</p>';
  h+='<div class="layout"><section class="cal" aria-label="Calendário de dezembro">'+renderCal()+'</section>';
  h+='<div class="layer'+(selected?" open":"")+'"><div class="scrim'+(selected?" open":"")+'" data-act="close"></div><aside class="panel'+(selected?" open":"")+'" aria-label="Horários do dia">'+renderPanel()+'</aside></div></div></div>';
  h+='<datalist id="servicos">'+SERVICES.map(function(s){return'<option value="'+s+'">'}).join("")+'</datalist>';
  h+='<div class="toastlayer"><div class="toast" role="status"><span class="tmsg"></span><button data-act="undo">Desfazer</button></div></div>';
  h+='<div class="modal" role="dialog" aria-modal="true"><div class="box"><h3 class="mtitle"></h3><p class="muted mtext"></p><textarea class="mta"></textarea><input type="file" class="mfile" accept=".html,.htm,.json,.txt,text/html,application/json,text/plain" hidden><div class="btns mbtns"></div></div></div>';
  root.innerHTML=h;
  document.documentElement.classList.toggle("lock",!!selected);
  fitTitle();
  if(keep){var p=document.querySelector(".panel");if(p)p.scrollTop=sc}
}

/* garante "Dezembro" inteiro numa linha, em qualquer tela */
function fitTitle(){
  var h=document.querySelector(".month"),m=h&&h.querySelector(".mname");if(!m)return;
  h.style.fontSize="";
  var avail=h.parentNode.clientWidth-10,w=m.getBoundingClientRect().width;
  if(w>avail&&w>0)h.style.fontSize=Math.floor(parseFloat(getComputedStyle(h).fontSize)*avail/w)+"px";
}
window.addEventListener("resize",fitTitle);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTitle);

/* ---------- avisos ---------- */
function toast(msg,canUndo){
  var t=document.querySelector(".toast");if(!t)return;t.querySelector(".tmsg").textContent=msg;
  t.querySelector("button").style.display=canUndo?"":"none";
  t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove("show");undo=null},5000);
}
function keepUndo(k){undo={k:k,day:clone(getDay(k))}}
function openModal(title,text,value,buttons,placeholder){
  var m=document.querySelector(".modal");
  buttons=buttons||[{label:"Fechar",fn:closeModal}];
  m.querySelector(".mtitle").textContent=title;m.querySelector(".mtext").textContent=text;
  var ta=m.querySelector(".mta");ta.value=value;ta.placeholder=placeholder||"";
  m.querySelector(".mbtns").innerHTML=buttons.map(function(b,i){return'<button class="b'+(i===0?" primary":"")+'" data-m="'+i+'">'+b.label+'</button>'}).join("");
  m.querySelectorAll("[data-m]").forEach(function(btn){btn.onclick=function(){buttons[+btn.dataset.m].fn(ta)}});
  m.classList.add("open");
}
function closeModal(){var m=document.querySelector(".modal");if(m)m.classList.remove("open")}
function copyText(text,okMsg){
  var fb=function(){openModal("Copiar texto","Selecione e copie o texto abaixo.",text)};
  try{navigator.clipboard.writeText(text).then(function(){toast(okMsg)},fb)}catch(e){fb()}
}
function weekFreeText(){
  var d=dateOf(selected),mon=new Date(d);mon.setDate(d.getDate()-(d.getDay()+6)%7);
  var lines=[],first=null,last=null;
  for(var i=0;i<6;i++){
    var x=new Date(mon);x.setDate(mon.getDate()+i);if(x.getMonth()!==M)continue;
    if(!first)first=new Date(x);last=new Date(x);
    var day=getDay(keyOf(x));if(day.closed)continue;
    var fr=day.slots.filter(function(s){return!s.booked}).map(function(s){return fmt(s.t)});
    if(fr.length)lines.push(WD_SHORT[x.getDay()]+" "+pad(x.getDate())+"/12: "+fr.join(", "));
  }
  var range=first.getDate()+" a "+last.getDate()+"/12";
  return lines.length?"Horários livres de "+range+":\n"+lines.join("\n"):"Semana de "+range+" sem horários livres.";
}

/* ---------- ações ---------- */
function afterChange(k,keep){if(days[k])days[k].u=Date.now();persist();render(keep!==false)}
root.addEventListener("click",function(e){
  var t=e.target.closest("[data-day],[data-slot],[data-act],[data-rm]");if(!t||t.disabled)return;
  if(t.dataset.rm!=null){
    var ri=+t.dataset.rm,rd=getDay(selected),rs=rd.slots[ri];if(!rs)return;
    if(rs.booked&&armed!==ri){armed=ri;render(true);toast("Esse horário tem cliente. Toque em Confirmar para remover.");return}
    keepUndo(selected);var dd=editDay(selected);dd.slots.splice(ri,1);armed=null;editing=null;afterChange(selected);
    toast("Horário de "+fmt(rs.t)+" removido",true);return;
  }
  armed=null;
  if(t.dataset.day){selected=t.dataset.day;editing=null;render();var p=document.querySelector(".panel");if(p)p.scrollTop=0;return}
  if(t.dataset.slot!=null){if(readOnly)return;var i=+t.dataset.slot;editing=editing===i?null:i;render(true);
    var f=document.querySelector('form.edit input[name="name"]');if(f&&window.matchMedia("(hover:hover)").matches)f.focus();return}
  var a=t.dataset.act,day,s;
  switch(a){
    case"close":selected=null;editing=null;render();break;
    case"cancel":editing=null;render(true);break;
    case"free":keepUndo(selected);day=editDay(selected);s=day.slots[editing];day.slots[editing]={t:s.t};editing=null;afterChange(selected);toast("Horário de "+fmt(s.t)+" liberado"+(s.name?" ("+s.name+")":""),true);break;
    case"remove":keepUndo(selected);day=editDay(selected);s=day.slots.splice(editing,1)[0];editing=null;afterChange(selected);toast("Horário de "+fmt(s.t)+" removido",true);break;
    case"reopen":day=editDay(selected);day.closed=false;day.label="";if(!day.slots.length)day.slots=DEFAULT_TIMES.map(function(t){return{t:t}});afterChange(selected);toast("Dia reaberto");break;
    case"backup":openModal("Passar para outro aparelho","1. Neste aparelho, toque em Salvar arquivo.\n2. Mande o arquivo para o outro aparelho por Bluetooth, Quick Share, AirDrop ou cabo USB (não precisa de internet).\n3. No outro aparelho, abra a agenda, toque em Outro aparelho › Carregar arquivo e escolha o arquivo recebido.\n\nAs marcações dos dois aparelhos são juntadas; se o mesmo dia foi mudado nos dois, fica a mudança mais recente.","",[
      {label:"Salvar arquivo",fn:function(){if(download("agenda-dezembro-"+stamp()+".html",buildDoc(),"text/html"))toast("Arquivo salvo em Downloads. Agora mande para o outro aparelho.");else toast("Este navegador não deixou salvar. Use Copiar texto.")}},
      {label:"Carregar arquivo",fn:function(){var fi=document.querySelector(".mfile");fi.value="";fi.click()}},
      {label:"Copiar texto",fn:function(){var txt=JSON.stringify({updated:updated,days:days});try{navigator.clipboard.writeText(txt).then(function(){toast("Texto copiado. Cole no outro aparelho.")},function(){copyText(txt,"")})}catch(e){copyText(txt,"")}}},
      {label:"Juntar texto colado",fn:function(ta){if(!ta.value.trim()){ta.focus();toast("Cole o texto na caixa primeiro.");return}importBackup(ta.value)}},
      {label:"Fechar",fn:closeModal}],"Ou cole aqui o texto copiado no outro aparelho");break;
    case"copyweek":copyText(weekFreeText(),"Horários livres copiados. É só colar no WhatsApp.");break;
    case"undo":if(undo){days[undo.k]=undo.day;var k=undo.k;undo=null;afterChange(k);var tt=document.querySelector(".toast");if(tt)tt.classList.remove("show")}break;
  }
});
root.addEventListener("change",function(e){
  var fi=e.target;if(!fi.classList||!fi.classList.contains("mfile")||!fi.files||!fi.files[0])return;
  var r=new FileReader();r.onload=function(){importBackup(r.result)};r.onerror=function(){toast("Não foi possível ler o arquivo.")};r.readAsText(fi.files[0]);
});
root.addEventListener("submit",function(e){
  var f=e.target;e.preventDefault();if(readOnly)return;var fd=new FormData(f),day;
  if(f.dataset.form==="slot"){
    day=editDay(selected);var i=+f.dataset.i,was=day.slots[i].booked;
    var t=fd.get("t")||day.slots[i].t;
    if(day.slots.some(function(x,j){return j!==i&&x.t===t})){toast("Já existe um horário às "+fmt(t));return}
    var n={t:t,booked:true,name:(fd.get("name")||"").trim(),service:(fd.get("service")||"").trim(),phone:(fd.get("phone")||"").trim(),note:(fd.get("note")||"").trim(),mark:fd.get("mark")==="on"};
    days[selected].slots[i]=n;days[selected]=clean(days[selected]);editing=null;afterChange(selected);
    if(pendingRender)render(true);
    toast(was?"Alterações salvas":"Horário de "+fmt(t)+" marcado");
  }else if(f.dataset.form==="add"){
    var tm=fd.get("t");if(!tm)return;day=editDay(selected);
    if(day.slots.some(function(x){return x.t===tm})){toast("Já existe um horário às "+fmt(tm));return}
    day.slots.push({t:tm});days[selected]=clean(day);afterChange(selected);toast("Horário de "+fmt(tm)+" adicionado");
  }else if(f.dataset.form==="closeday"){
    day=getDay(selected);var bk=day.slots.filter(function(x){return x.booked}).length;
    if(bk&&!f.dataset.confirm){f.dataset.confirm="1";f.querySelector("button").textContent="Fechar mesmo assim ("+bk+" marcado"+(bk>1?"s":"")+")";return}
    keepUndo(selected);day=editDay(selected);day.closed=true;day.label=(fd.get("label")||"").trim().slice(0,60);editing=null;afterChange(selected);toast("Dia fechado",true);
  }
});
/* arrastar o painel do dia para baixo para fechar (celular) */
var drag=null;
function closeSheet(){selected=null;editing=null;armed=null;render()}
root.addEventListener("touchstart",function(e){
  if(window.innerWidth>=960||e.touches.length!==1)return;
  var p=e.target.closest(".panel.open");if(!p)return;
  if(e.target.closest("input,textarea,select"))return;
  var handle=!!e.target.closest(".grab,.ph");
  if(!handle&&p.scrollTop>0)return;
  drag={p:p,s:document.querySelector(".scrim"),y0:e.touches[0].clientY,x0:e.touches[0].clientX,t0:Date.now(),dy:0,handle:handle,active:false};
},{passive:true});
root.addEventListener("touchmove",function(e){
  if(!drag)return;
  var dy=e.touches[0].clientY-drag.y0,dx=e.touches[0].clientX-drag.x0;
  if(!drag.active){
    if(dy>8&&dy>Math.abs(dx)&&(drag.handle||drag.p.scrollTop<=0)){drag.active=true;drag.y0+=dy;dy=0;drag.p.style.transition="none";if(drag.s)drag.s.style.transition="none"}
    else if(dy<-8||Math.abs(dx)>12){drag=null;return}
    else return;
  }
  e.preventDefault();
  drag.dy=Math.max(0,dy);
  drag.p.style.transform="translateY("+drag.dy+"px)";
  if(drag.s)drag.s.style.opacity=String(Math.max(0,1-drag.dy/drag.p.offsetHeight));
},{passive:false});
function endDrag(){
  if(!drag)return;var d=drag;drag=null;if(!d.active)return;
  var v=d.dy/Math.max(1,Date.now()-d.t0);
  if(d.dy>Math.min(140,d.p.offsetHeight*.28)||(v>.5&&d.dy>30)){
    d.p.style.transition="transform .18s ease-in";d.p.style.transform="translateY(100%)";
    if(d.s){d.s.style.transition="opacity .18s";d.s.style.opacity="0"}
    setTimeout(closeSheet,170);
  }else{
    d.p.style.transition="";d.p.style.transform="";if(d.s){d.s.style.transition="";d.s.style.opacity=""}
  }
}
root.addEventListener("touchend",endDrag);
root.addEventListener("touchcancel",endDrag);

document.addEventListener("keydown",function(e){
  if(e.key!=="Escape")return;
  var m=document.querySelector(".modal.open");if(m){closeModal();return}
  if(editing!==null){editing=null;render(true)}else if(selected){selected=null;render()}
});
render();start();
})();
</script>
</body>
</html>
